<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">First to 5 points wins.</p>

    <div class="choices">
      <button class="choice" data-choice="rock">✊ Rock</button>
      <button class="choice" data-choice="paper">✋ Paper</button>
      <button class="choice" data-choice="scissors">✌️ Scissors</button>
    </div>

    <div class="scoreboard">
      <div class="score">
        <span class="label">You</span>
        <span id="human-score">0</span>
      </div>
      <div class="score">
        <span class="label">Computer</span>
        <span id="computer-score">0</span>
      </div>
    </div>

    <div id="results" class="results">Pick a move to start.</div>
    <div id="winner" class="winner"></div>

    <button id="reset" class="reset" hidden>Play Again</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
